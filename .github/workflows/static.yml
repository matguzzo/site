# Builds the site and publishes it to GitHub Pages. Never commits anything,
# so the repo history only shows deliberate, human-approved changes.
name: Build and deploy matguzzo.com

on:
  push:
    branches: [main]          # every approved change goes live
  schedule:
    - cron: '17 6 * * 1'      # Mondays 06:17 UTC: pick up new Substack posts
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node src/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
